<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הבית החכם</title>
<style>
:root{--bg:#eaeef1;--ink:#141d26;--card:#f7f9fb;--line:#d3dce3;--acc:#0d7d74}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Heebo,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
#home{min-height:100%;padding:clamp(16px,4vw,48px);max-width:720px;margin:0 auto}
h1{font-size:26px;margin-bottom:24px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.tile{aspect-ratio:1/1;border:1px solid var(--line);border-radius:22px;background:var(--card);
 box-shadow:0 1px 2px rgba(20,29,38,.06),0 8px 24px rgba(20,29,38,.08);cursor:pointer;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
 font:inherit;color:inherit;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile:active{transform:scale(.97)}
.ic{font-size:44px;line-height:1}
.nm{font-size:22px;font-weight:700}
#view{display:none;position:fixed;inset:0;flex-direction:column;background:var(--bg)}
#bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#1b2733;color:#fff}
#back{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;background:#fff;color:#1b2733;cursor:pointer}
#ttl{font-weight:700}
#frames{flex:1;position:relative}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

const frames={};
function dec(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a)}
function openK(k){
  const f=document.getElementById('frames');
  if(!frames[k]){const i=document.createElement('iframe');i.srcdoc=dec(D[k]);f.appendChild(i);frames[k]=i}
  for(const x in frames)frames[x].style.display=x===k?'block':'none';
  document.getElementById('ttl').textContent=T[k];
  document.getElementById('home').style.display='none';
  document.getElementById('view').style.display='flex';
}
function goHome(){
  document.getElementById('view').style.display='none';
  document.getElementById('home').style.display='block';
}
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>openK(b.dataset.k));
document.getElementById('back').onclick=goHome;
</script>
